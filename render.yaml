services:
  - type: web
    name: npl-news-api
    runtime: python
    plan: free
    rootDir: NLP_NEWS_PROJECT_AUCC/backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: APP_MODE
        value: live
      - key: YOUTUBE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: '["https://deft-panda-5308e1.netlify.app"]'
